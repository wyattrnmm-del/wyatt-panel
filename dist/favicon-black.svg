<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">Wyatt-Panel</title>
  <desc id="desc">A colorful W-shaped control panel mark</desc>
  <defs>
